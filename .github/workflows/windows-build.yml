name: Windows Build

on:
  pull_request:
    branches:
      - main

  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64

    runs-on: windows-latest

    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Show Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Build Windows release artifact
        shell: pwsh
        run: .\scripts\build-windows.ps1

      - name: List release artifacts
        shell: pwsh
        run: Get-ChildItem .\artifacts\

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: documents-organizer-windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256.txt
          if-no-files-found: error
          retention-days: 14