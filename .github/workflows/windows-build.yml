name: Windows Build

on:
  pull_request:
    branches:
      - main

  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64

    runs-on: windows-latest

    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Show Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Build Windows release artifact
        shell: pwsh
        run: .\scripts\build-windows.ps1

      - name: List release artifacts
        shell: pwsh
        run: Get-ChildItem .\artifacts\

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: documents-organizer-windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - build

    runs-on: ubuntu-latest

    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download Windows release artifacts
        uses: actions/download-artifact@v8
        with:
          name: documents-organizer-windows-x64
          path: artifacts

      - name: List release files
        shell: bash
        run: ls -la artifacts

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = "${{ github.ref_name }}"

          Write-Host "Publishing release for tag:"
          Write-Host "  $Tag"

          $ZipFiles = Get-ChildItem `
              -Path "artifacts" `
              -Filter "*.zip"

          $ChecksumFiles = Get-ChildItem `
              -Path "artifacts" `
              -Filter "*.sha256.txt"

          if ($ZipFiles.Count -ne 1) {
              throw (
                  "Expected exactly one release ZIP, " +
                  "found $($ZipFiles.Count)."
              )
          }

          if ($ChecksumFiles.Count -ne 1) {
              throw (
                  "Expected exactly one SHA-256 checksum, " +
                  "found $($ChecksumFiles.Count)."
              )
          }

          $ReleaseFiles = @(
              $ZipFiles[0].FullName
              $ChecksumFiles[0].FullName
          )

          $ReleaseExists = $false

          gh release view `
              $Tag `
              --repo "${{ github.repository }}" `
              --json tagName `
              *> $null

          if ($LASTEXITCODE -eq 0) {
              $ReleaseExists = $true
          }

          if ($ReleaseExists) {
              Write-Host (
                  "Release already exists. " +
                  "Updating attached assets."
              )

              gh release upload `
                  $Tag `
                  $ReleaseFiles `
                  --clobber `
                  --repo "${{ github.repository }}"

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to update release assets."
              }

              Write-Host "Release assets updated successfully."

              exit 0
          }

          if (
              $Tag -match
              '^v(\d+\.\d+\.\d+)-rc(\d+)$'
          ) {
              $Version = $Matches[1]
              $RcNumber = $Matches[2]

              $Title = (
                  "Documents Organizer v" +
                  $Version +
                  " RC" +
                  $RcNumber
              )

              Write-Host "Creating prerelease:"
              Write-Host "  $Title"

              gh release create `
                  $Tag `
                  $ReleaseFiles `
                  --verify-tag `
                  --title $Title `
                  --generate-notes `
                  --prerelease `
                  --latest=false `
                  --repo "${{ github.repository }}"
          }
          elseif (
              $Tag -match
              '^v(\d+\.\d+\.\d+)$'
          ) {
              $Version = $Matches[1]

              $Title = (
                  "Documents Organizer v" +
                  $Version
              )

              Write-Host "Creating stable release:"
              Write-Host "  $Title"

              gh release create `
                  $Tag `
                  $ReleaseFiles `
                  --verify-tag `
                  --title $Title `
                  --generate-notes `
                  --latest `
                  --repo "${{ github.repository }}"
          }
          else {
              throw (
                  "Unsupported release tag format: " +
                  $Tag
              )
          }

          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release creation failed."
          }

          Write-Host ""
          Write-Host "GitHub release published successfully."